name: Build Isle

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: isle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Isle.xcodeproj \
            -scheme Isle \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package Isle.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Isle.app Payload/
          zip -qry Isle.ipa Payload
          ls -lh Isle.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Isle.ipa \
            --title "Isle build ${{ github.run_number }}" \
            --notes "Unsigned build of ${GITHUB_SHA::7}. Install with Sideloadly or AltStore." \
            --target "$GITHUB_SHA" --latest

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Isle-ipa
          path: Isle.ipa

      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir -p logs
          cp build.log logs/ 2>/dev/null || echo "no build log" > logs/build.log
          grep -E "error:" build.log > logs/errors.txt 2>/dev/null || true
          cd logs
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "Build log for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

  tests:
    name: Unit tests (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Pick a simulator
        id: sim
        run: echo "udid=$(python3 tools/pick_simulator.py)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Isle.xcodeproj \
            -scheme Isle \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log | grep -E "error:|Test Case .* (passed|failed)|Executed|TEST" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
